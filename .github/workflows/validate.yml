name: Validate skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install GNU Make on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install make
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Validate JavaScript syntax
        run: node --check scripts/bootstrap-template.mjs

      - name: Run bootstrap tests
        run: node --test scripts/tests/bootstrap-template.test.mjs
